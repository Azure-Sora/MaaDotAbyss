# 每日任务清单
# 字段说明：
#   prompt         任务指令（给 Agent 的目标与路径提示）
#   exit_condition 完成判据（验证器用它对新鲜截图做独立核验）
#   fast_routine   可选；先走无模型程序快跑，失败才降级给 Agent
#   validation     可选；默认 inline 复用 report evidence，高风险任务设 strict 独立模型复核

window_title: "ドットアビスX"
resolution: [1280, 720]

tasks:
  - id: claim_idle_reward
    name: 领取挂机奖励
    fast_routine: claim_idle_reward  # 固定坐标+结算状态机；失败才让 LLM 接管
    prompt: |
      在主页面点击右下角的大宝箱（宝箱旁有"MAXまで"倒计时文字）领取挂机（放置）奖励。只需领取一次。
      领取后会出现"探索報酬"结算画面（展示获得的装备/道具/EXP/金币），可能有多页：
      反复点击画面底部的「確認して次へ」（确认并继续）或「探索」按钮，直到回到主页面。
      若途中出现「自動分解確認」弹窗（装备数量达到上限），直接点击黄色「分解する」按钮确认——
      用户已启用自动分解设置，确认分解即可，不要取消。
      若点击宝箱后没有出现任何新画面（说明当前没有可领的挂机奖励，或刚才已经领过），不要反复点击宝箱，直接完成任务。
      最后确认回到主页面（左下角"主页"按钮可随时返回）。
    exit_condition: 主页面完整可见（底部导航"主页/队伍/酒馆/商店/抽卡/冒险/探索队"可见），没有任何弹窗遮挡。

  - id: claim_gifts_new
    name: 新领取礼物
    flow: claim_gifts_new          # 教学：先剧本后 LLM 兜底
    prompt: |
      在主页查看右下角的礼物按钮，若按钮上有带数字的红点，说明有未领取礼物：点击礼物按钮进入礼物盒子页面，点击底部「一括受け取り」按钮一键领取全部礼物；随后会弹出「受け取り確認」领取结果弹窗，点击OK关闭；确认未受け取り数变为0/300（列表显示プレゼントがありません）后，点击「閉じる」退出礼物盒子页面返回主页。若主页礼物按钮没有红点数字，则没有礼物可领，直接结束。
    exit_condition: 回到主页，且右下角礼物按钮上的红点数字消失；或礼物盒子页面显示未受け取り数0/300且列表为「プレゼントがありません」
  - id: adventure_forces
    name: 冒险-势力任务
    prompt: |
      目标：清理"勢力任務"（势力任务）今日开放的关卡。
      路径：主页 → 底部导航"冒险" → 点"勢力任務"（勢力クエスト）。
      到达势力任务列表页（五张关卡卡可见）后，调用程序接管连打：
      {"action": "auto", "routine": "forces_sweep"}
      程序会自动选关、出击、等战斗、翻结算，把所有开放关卡打完并回报。
      - 回报 done → 直接返回主页（无底部导航时先点左上◆返回，再点"主页"）→ report done。
      - 回报 wrong_scene → 说明你还没走到列表页，按上面路径重新导航。
      - 回报 partial → 按 detail 接手处理（如个别关卡异常），能继续则继续，全部打完同样返主页。
      注意：不要自己逐场战斗（太慢会耗尽时间预算）；灰色"現在依頼はありません"的卡是未开放，程序会自动跳过。
    exit_condition: 已回到主页面（底部导航"主页/队伍/…"可见，无弹窗遮挡）。

  - id: adventure_intercept
    name: 冒险-迎击战
    prompt: |
      路径：主页面点底部导航“冒险” → 点击“迎撃戦”（=迎击战）。
      到达迎击战页面（三个小 boss 卡可见）后，调用程序接管连打（2026-08-31 游戏更新后已编排好命名程序）：
      {"action": "auto", "routine": "disaster_skip_sweep"}
      程序会先打 1 场战斗，随后在剩余 boss 的详情弹窗点「スキップ」，直接跳过剩余委托并领取全部奖励（无需逐场战斗，比逐个打快约 3 倍），完成后回报。
      - 回报 done → 返回主页面 → report done。
      - 回报 wrong_scene → 按路径重新导航到迎击战页后再次调用。
      - 回报 partial → 按 detail 接手；个别 boss 打不过属于正常，跳过即可。
      - 若 disaster_skip_sweep 报错 → 改用旧程序 disaster_sweep 兜底（逐个打）：{"action": "auto", "routine": "disaster_sweep"}。
      不要自己逐个 boss 连打（太慢会耗尽时间预算）。
    exit_condition: 已回到主页面（底部导航可见，无弹窗）。
    supplement: 现在的接管程序有bug，只会打第一个boss后跳过第二个，但第三个boss也应该跳过

  - id: expedition
    name: 探索队-探索任务
    prompt: |
      路径：主页面点底部导航"探索队" → 到达探索队页面（IdleExploration）。
      到达后调用程序接管连打：
      {"action": "auto", "routine": "expedition_sweep"}
      程序会打开探索クエスト列表，把第一个任务的免费次数打完（免费次数耗尽时程序会自动拒绝恢复弹窗）并回报。
      - 回报 done → 返回主页面 → report done。
      - 回报 wrong_scene → 按路径重新导航（注意别点"第N階層を探索"，那是挂机派遣不是探索任务）。
      - 回报 partial → 按 detail 接手。
      不要自己逐次出撃连打（太慢会耗尽时间预算）。
    exit_condition: 已回到主页面（底部导航可见，无弹窗）。

  - id: claim_missions
    name: 任务一键领取
    prompt: |
      在主页面点击右侧的“任务”按钮（列表图标；日文 任務 同样是它）。
      进入任务页面后，一直点击“一键领取/一括受け取り”按钮，直到按钮变灰为止，所有任务的奖励都能这样领取，不需要手动切换页签复查；
      领取过程中出现的获得物品弹窗逐个关闭。
      完成后返回主页面。
    exit_condition: 任务页面中没有仍然可领取（高亮领取按钮）的任务，且无弹窗遮挡。
  - id: daily_pack
    name: 每日免费礼包
    flow: daily_pack          # 教学：先剧本后 LLM 兜底
    prompt: |
      任务：购买每日免费礼包并返回主页。步骤：1. 点击底部导航栏的『商店』按钮进入商店主页（注意避开旁边的『抽卡』入口）；2. 点击右侧『ショップ Shop』入口进入shop页面；3. 点击左侧菜单『お得なパック』（优惠礼包/超值礼包）分类；4. 点击顶部マンスリー/ウィークリー/デイリー三个页签中最右侧的『デイリー』切换到daily页签；5. 在デイリー页签左上角找到『デイリー無料パック』（剩余1回、价格 DMMポイント 0），点击其购买按钮；6. 弹出『購入内容確認』确认框（商品为デイリー無料パック，DMMポイント 0），点击『購入』确认购买；7. 弹出『受け取り確認』显示已购入アビスジェム×10与うれしいプレゼント×1，点击『OK』关闭弹窗完成领取；8. 按用户要求，最后一步点击底部导航栏的『主页』按钮返回主页。
    exit_condition: 依次出现并正确处理『購入内容確認』（已点購入）和『受け取り確認』（已点OK）弹窗后，点击『主页』回到游戏主页界面即为完成；若复核，商店-お得なパック-デイリー页签中『デイリー無料パック』应显示剩余0回。
