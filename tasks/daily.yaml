# 每日任务清单
# 字段说明：
#   prompt         任务指令（给 Agent 的目标与路径提示）
#   exit_condition 完成判据（验证器用它对新鲜截图做独立核验）

window_title: "ドットアビスX"
resolution: [1280, 720]

tasks:
  - id: claim_idle_reward
    name: 领取挂机奖励
    # 前置检查：右下角"MAXまで H:MM"倒计时（满值 16h）。剩余 > 14h 视为刚领过，整任务跳过。
    precondition:
      type: idle_timer
      region: [1060, 672, 1279, 714]
      skip_if_remaining_above_hours: 14.0
    prompt: |
      在主页面点击右下角的大宝箱（宝箱旁有"MAXまで"倒计时文字）领取挂机（放置）奖励。只需领取一次。
      领取后会出现"探索報酬"结算画面（展示获得的装备/道具/EXP/金币），可能有多页：
      反复点击画面底部的「確認して次へ」（确认并继续）或「探索」按钮，直到回到主页面。
      若途中出现「自動分解確認」弹窗（装备数量达到上限），直接点击黄色「分解する」按钮确认——
      用户已启用自动分解设置，确认分解即可，不要取消。
      若点击宝箱后没有出现任何新画面（说明当前没有可领的挂机奖励，或刚才已经领过），不要反复点击宝箱，直接完成任务。
      最后确认回到主页面（左下角"主页"按钮可随时返回）。
    exit_condition: 主页面完整可见（底部导航"主页/队伍/酒馆/商店/抽卡/冒险/探索队"可见），没有任何弹窗遮挡。

  - id: claim_gifts
    name: 领取礼物
    prompt: |
      在主页面点击右侧的"礼物"按钮（礼盒图标，可能有红色数字角标；若显示日文 プレゼント 同样是它）。
      进入礼物/收件箱页面后，领取全部可领取的附件奖励：逐个点击可领取的条目或使用"一键领取/全て受け取り"类按钮。
      日文提示：受け取る=领取、全て受け取り=全部领取。
      领取过程中出现的获得物品弹窗逐个关闭。
      领完后返回主页面。
    exit_condition: 已回到主页面，右侧礼物按钮不再显示可领取的红色角标（或明显小于进入前），无弹窗遮挡。

  - id: adventure_forces
    name: 冒险-势力任务
    prompt: |
      目标：清理"勢力任務"（势力任务）今日开放的关卡。
      路径：主页 → 底部导航"冒险" → 点"勢力任務"（勢力クエスト）。
      规则：
      1. 五个大关每日只开放几个；灰色/锁定的是未开放，跳过；只打开放的。
      2. 每关：进准备页点「出撃」（出击）→ 战斗自动进行 → wait_stable 等待结束 →
         结算画面点确认（次へ/OK/画面点击）→ 回到关卡列表看剩余次数（残り回数）。
      3. 剩余次数 0 → 下一关；战斗失败（打不过）→ 放弃该关，下一关，勿重试。
      4. 全部开放关卡打完后 → 返回主页 → report done。
      注意：入场动画期间看不到 AUTO/倍速按钮，不是没进战斗；务必看清当前页面再行动，
      在主页时就先点"冒险"，不要凭空想象页面内容。
    exit_condition: 已回到主页面（底部导航"主页/队伍/…"可见，无弹窗遮挡）。

  - id: adventure_intercept
    name: 冒险-迎击战
    prompt: |
      路径：主页面点底部导航"冒险" → 点击"迎撃戦"（=迎击战）。
      迎击战页面里有若干 boss，需要打的是下面的三个小 boss。
      对每个小 boss：选中后进入出击准备页，点击"出撃"（=出击）开始战斗；打到该 boss 剩余次数为 0 或打不过为止。
      战斗失败就换下一个 boss，不要重试。
      战斗注意：可能有入场动画，AUTO/倍速按钮在右下角、动画结束后才出现；
      战斗中用 wait_stable 等待结束；结算画面点击确认/次へ继续。
      三个 boss 都处理完后，返回主页面。
    exit_condition: 已回到主页面（底部导航可见，无弹窗）。

  - id: expedition
    name: 探索队-探索任务
    prompt: |
      路径：主页面点底部导航"探索队" → 在探索队页面点击右侧的"探索任務"（=探索任务）。
      在探索任务列表中选择第一个任务，进入后点击"出撃"（=出击）开始战斗。
      重复出击直到该任务的剩余次数（残り回数）为 0，或战斗失败为止。
      【重要】只打免费次数：若弹出"消耗アビスジェム恢复挑战次数"（消費して…復させますか）之类的购买/恢复确认弹窗，
      一律点「キャンセル」拒绝，然后视为本任务完成。
      战斗注意：可能有入场动画，AUTO/倍速按钮在右下角、动画结束后才出现；
      战斗中用 wait_stable 等待结束；结算画面点击确认/次へ继续。
      完成后返回主页面。
    exit_condition: 已回到主页面（底部导航可见，无弹窗）。

  - id: claim_missions
    name: 任务一键领取
    prompt: |
      在主页面点击右侧的"任务"按钮（列表图标；日文 任務 同样是它）。
      进入任务页面后，使用"一键领取/一括受け取り"类按钮领取全部已完成的任务奖励；
      若没有一键按钮，则逐个领取可领取（领取按钮高亮）的任务奖励。
      领取过程中出现的获得物品弹窗逐个关闭。
      完成后停在任务页面或返回主页面均可。
    exit_condition: 任务页面中没有仍然可领取（高亮领取按钮）的任务，且无弹窗遮挡。
